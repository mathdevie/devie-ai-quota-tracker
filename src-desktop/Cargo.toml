[package]
name = "devie-quota"
version = "0.14.3"
description = "A local AI subscription quota tracker"
authors = ["Devie"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/mathdevie/devie-ai-quota-tracker"
homepage = "https://github.com/mathdevie/devie-ai-quota-tracker"

[lib]
name = "devie_quota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "form",
  "query",
  "rustls",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sys-locale = "0.3"
tauri = { version = "=2.12.5", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "net", "rt", "macros"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = "1"
tauri-plugin-autostart = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPanel",
  "NSResponder",
  "NSWindow",
  "NSEvent",
  "NSApplication",
  "NSRunningApplication",
  "NSStatusItem",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
  "NSView",
  "NSMenu",
  "NSMenuItem",
  "block2",
] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSObject",
  "NSString",
  "NSError",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNUserNotificationCenter",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSettings",
  "UNNotificationTrigger",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphicsContext"] }

[[test]]
name = "tray_activation"
# AppKit must run on the process main thread, not a Rust test worker.
harness = false
