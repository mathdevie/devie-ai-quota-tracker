[package]
name = "devie-qt"
version = "0.1.0"
description = "A local AI subscription quota tracker"
authors = ["Devie"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devie_qt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
portable-pty = "0.9"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strip-ansi-escapes = "0.2"
tauri = { version = "=2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2.3.1", features = ["tray-icon"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["v5", "serde"] }
walkdir = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
