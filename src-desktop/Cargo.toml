[package]
name = "devie-quota"
version = "0.1.0"
description = "A local AI subscription quota tracker"
authors = ["Devie"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devie_quota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tauri = { version = "=2.11.3", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-positioner = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "net", "rt", "macros"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPanel", "NSResponder", "NSWindow", "NSEvent", "NSApplication", "NSRunningApplication", "block2"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
