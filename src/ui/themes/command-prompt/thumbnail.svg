<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur-command-prompt" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain-command-prompt" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="42" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="overlay"/>
    </filter>
    <clipPath id="clip-command-prompt">
      <rect width="120" height="120" rx="16" ry="16"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#clip-command-prompt)">
    <!-- Solid background base -->
    <rect width="120" height="120" fill="#000000"/>
    
    <!-- Fixed position blobs - diagonal gradient from top-left to bottom-right -->
    <!-- Main primary blob - bottom right -->
    <ellipse cx="100" cy="100" rx="70" ry="65" fill="#00ff00" filter="url(#blur-command-prompt)"/>
    
    <!-- Secondary blob - middle area -->
    <ellipse cx="65" cy="75" rx="45" ry="40" fill="#00ff00" filter="url(#blur-command-prompt)"/>
    
    <!-- Light accent - transition zone -->
    <ellipse cx="45" cy="55" rx="35" ry="30" fill="#59ff59" filter="url(#blur-command-prompt)"/>
    
    <!-- Dark accent - corner depth -->
    <ellipse cx="115" cy="115" rx="40" ry="35" fill="#00bf00" filter="url(#blur-command-prompt)"/>
    
    <!-- Subtle grain overlay -->
    <rect width="120" height="120" fill="#000000" filter="url(#grain-command-prompt)" opacity="0.1"/>
  </g>
  
  <!-- Rounded border -->
  <rect width="120" height="120" rx="16" ry="16" fill="none" stroke="#00ff00" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>