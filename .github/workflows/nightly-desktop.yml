# Nightly desktop release: builds the current commit and publishes it to the
# `nightly` channel on CrabNebula Cloud. Same shape as the stable pipeline
# (release-desktop.yml), with two differences:
#   - Runs on demand (workflow_dispatch), not on a tag.
#   - The version is the next patch over src-desktop/tauri.conf.json plus a
#     `-nightly.<timestamp>` suffix, so nightly always sorts above the latest
#     stable and the updater offers it to users on the nightly channel.
#
# The app's stable channel is CrabNebula's unnamed default channel; nothing
# published here is ever seen by users on stable.
#
# Required secrets: same as release-desktop.yml (Release environment).

name: Nightly Desktop App

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for the macOS build"
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - macos-15

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CN_APPLICATION: "mathdev/devie-quota"

jobs:
  draft:
    runs-on: ${{ inputs.runner == 'macos-15' && 'ubuntu-24.04' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    environment: Release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # One version for every job: computed once here, so a run that crosses
      # midnight cannot draft and upload two different versions.
      - name: Compute the nightly version
        id: version
        run: |
          base="$(jq -er '.version' src-desktop/tauri.conf.json | cut -d- -f1)"
          IFS=. read -r major minor patch <<< "$base"
          version="${major}.${minor}.$((patch + 1))-nightly.$(date -u +%Y%m%d%H%M)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${version}"

      - name: Create the draft release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} "${{ steps.version.outputs.version }}" --channel nightly
          api-key: ${{ secrets.CN_API_KEY }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            target: aarch64-apple-darwin
    name: Build ${{ matrix.name }}
    runs-on: ${{ inputs.runner == 'macos-15' && 'macos-15' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    environment: Release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The updater endpoint and the Settings page read this version.
      - name: Set the nightly version
        run: |
          jq --arg version "${{ needs.draft.outputs.version }}" '.version = $version' \
            src-desktop/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-desktop/tauri.conf.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-desktop -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check the signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::The Release environment lacks ${secret_name}."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build, sign, and notarize the app
        run: bunx tauri build --target "${{ matrix.target }}" --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # --framework tauri reads the patched version from tauri.conf.json.
      - name: Upload the build to CrabNebula
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri --channel nightly
          api-key: ${{ secrets.CN_API_KEY }}

  publish:
    needs: [draft, build]
    runs-on: ${{ inputs.runner == 'macos-15' && 'ubuntu-24.04' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    environment: Release
    steps:
      - name: Publish the release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} "${{ needs.draft.outputs.version }}" --channel nightly
          api-key: ${{ secrets.CN_API_KEY }}
