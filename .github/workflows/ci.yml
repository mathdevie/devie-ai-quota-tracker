name: CI

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for the checks"
        type: choice
        default: self-hosted
        options: [self-hosted, macos-15]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the POC
    # GitHub-hosted macOS runners are not available for this private repo
    # (jobs fail before a runner is assigned), so the checks run on the
    # self-hosted Mac by default, like the release workflow.
    runs-on: ${{ inputs.runner == 'macos-15' && 'macos-15' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-desktop -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check the frontend
        run: bun run check

      - name: Build the frontend
        run: bun run build

      - name: Test the native core
        working-directory: src-desktop
        run: cargo test --locked
