# Desktop release pipeline: builds, signs, and publishes Devie Quota to
# CrabNebula Cloud.
#
# Trigger: manual dispatch only. The workflow reads the version from
#   src-desktop/tauri.conf.json (bump it first with `bun run bump X.Y.Z`),
#   refuses to run when the `v<version>` tag already exists, and tags the
#   released commit after a successful publish.
# Runner: self-hosted by default while the repository is private (hosted
#   macOS runners are not available here). A dispatch with runner=macos-15
#   uses the GitHub-hosted macos-15 and ubuntu-24.04 runners. Before the
#   repository goes public, remove the self-hosted option (plan, 8.0).
#
# Required secrets (Release environment):
#   - CN_API_KEY: CrabNebula Cloud API key
#   - TAURI_SIGNING_PRIVATE_KEY: updater signing key (`bunx tauri signer generate`)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: password for that key
#   - APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID: macOS signing and notarization

name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for the macOS build"
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - macos-15

# contents: write lets the publish job push the release tag.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CN_APPLICATION: "mathdev/devie-quota"

jobs:
  draft:
    runs-on: ${{ inputs.runner == 'macos-15' && 'ubuntu-24.04' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    environment: Release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the app version and check that it is unreleased
        id: version
        run: |
          version="$(jq -er '.version' src-desktop/tauri.conf.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "::error::Tag v${version} already exists. Run 'bun run bump' first."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            target: aarch64-apple-darwin
    name: Build ${{ matrix.name }}
    runs-on: ${{ inputs.runner == 'macos-15' && 'macos-15' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    environment: Release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-desktop -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check the signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::The Release environment lacks ${secret_name}."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build, sign, and notarize the app
        run: bunx tauri build --target "${{ matrix.target }}" --bundles app,dmg
        env:
          # Optional: without it the build sends no telemetry.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload the build to CrabNebula
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  publish:
    needs: [draft, build]
    runs-on: ${{ inputs.runner == 'macos-15' && 'ubuntu-24.04' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    environment: Release
    steps:
      - uses: actions/checkout@v7

      - name: Publish the release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

      # The tag records what shipped; it is not a trigger. A tag pushed with
      # the workflow token starts no other workflow, which is intended.
      - name: Tag the released commit
        run: |
          git tag "v${{ needs.draft.outputs.version }}"
          git push origin "v${{ needs.draft.outputs.version }}"
